<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Precision Shape Pattern Scanner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00adb5;
            margin-bottom: 10px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        #videoContainer {
            position: relative;
            width: 100%;
            height: auto;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #333;
        }

        video {
            display: none; /* Hidden, we render via canvas */
        }

        canvas {
            width: 100%;
            display: block;
        }

        .overlay-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px dashed #00adb5;
            width: 90%;
            height: 40%;
            pointer-events: none;
            box-sizing: border-box;
        }

        .overlay-text {
            position: absolute;
            top: 5px;
            left: 10px;
            color: #00adb5;
            font-size: 12px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
        }

        #statusBox {
            margin-top: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            border-left: 5px solid #00adb5;
        }

        .live-bits {
            font-size: 24px;
            font-family: monospace;
            letter-spacing: 4px;
            color: #ffe600;
            margin: 5px 0;
        }

        #profileCard {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #2b5876, #4e4376);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .card-body {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .user-info h2 {
            margin: 0;
            font-size: 22px;
            color: #fff;
        }
        .user-info p {
            margin: 5px 0 0 0;
            color: #ddd;
            font-size: 14px;
        }

        #loading {
            font-size: 18px;
            color: #ffe600;
        }
    </style>
</head>
<body>

    <h1>Shape Pattern ID Scanner</h1>
    <p id="loading">Loading Computer Vision Engine (OpenCV)... Please wait.</p>

    <div class="container" style="display:none;" id="appContainer">
        <div id="videoContainer">
            <video id="videoInput" playsinline></video>
            <canvas id="canvasOutput"></canvas>
            <div class="overlay-grid">
                <div class="overlay-text">ALIGN 8 SHAPES HERE</div>
            </div>
        </div>

        <div id="statusBox">
            <div><strong>Current Detected Pattern:</strong></div>
            <div id="bitStream" class="live-bits">--------</div>
            <div id="systemMessage">Searching for 8 valid shapes...</div>
        </div>
    </div>

    <div id="profileCard">
        <div class="card-header">Access Granted // Identity Verified</div>
        <div class="card-body">
            <div class="avatar" id="cardAvatar">👤</div>
            <div class="user-info">
                <h2 id="cardName">John Doe</h2>
                <p id="cardRole">Authorized Personnel</p>
                <p id="cardUID" style="font-family: monospace; font-size:11px; color:#bbb; margin-top:5px;"></p>
            </div>
        </div>
    </div>

    <script async src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript" onload="onOpenCvReady();"></script>

    <script>
        const video = document.getElementById('videoInput');
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d');
        
        // Target Database Configuration
        const ACCOUNTS = {
            "10010101": { name: "Muhammad", role: "System Administrator", avatar: "👑" },
            "01101110": { name: "Hassan", role: "Senior Security Engineer", avatar: "🛡️" },
            "00010110": { name: "Hussain", role: "Database Architect", avatar: "💻" }
        };

        let src, dst, gray, ready = false;

        function onOpenCvReady() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            startCamera();
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 640, height: 480 } })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    video.addEventListener('canplay', () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        // Initialize OpenCV matrices once video proportions are known
                        src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
                        dst = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
                        gray = new cv.Mat();
                        ready = true;
                        requestAnimationFrame(processVideo);
                    });
                })
                .catch(function(err) {
                    console.error("Camera Error: ", err);
                    document.getElementById('systemMessage').innerText = "Camera access denied or unavailable.";
                });
        }

        function processVideo() {
            if (!ready) return;

            // Capture current frame from video to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            src.data.set(imageData.data);

            // 1. Pre-processing: Grayscale & Adaptive Thresholding (handles varying light and angles)
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

            // 2. Find Contours
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let detectedShapes = [];

            // 3. Analyze Geometries
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                let perimeter = cv.arcLength(cnt, true);
                
                // Filter out background noise and massive shapes
                if (area > 150 && area < (canvas.width * canvas.height * 0.2)) {
                    let approx = new cv.Mat();
                    // Epsilon tuning establishes high angular precision
                    cv.approxPolyDP(cnt, approx, 0.04 * perimeter, true);

                    let rect = cv.boundingRect(cnt);
                    let aspectRatio = rect.width / rect.height;

                    // Ensure shape isn't excessively stretched (unlikely code pattern dimensions)
                    if (aspectRatio >= 0.7 && aspectRatio <= 1.3) {
                        let shapeType = null;

                        // Check vertices to identify structural geometry
                        if (approx.rows === 4) {
                            shapeType = "1"; // Square / Rectangle
                        } else if (approx.rows > 5) {
                            // High vertices count with uniform radius signifies a circle
                            let circularity = (4 * Math.PI * area) / (perimeter * perimeter);
                            if (circularity > 0.7) {
                                shapeType = "0"; // Circle
                            }
                        }

                        if (shapeType !== null) {
                            detectedShapes.push({
                                type: shapeType,
                                x: rect.x + rect.width / 2,
                                y: rect.y + rect.height / 2,
                                box: rect
                            });
                        }
                    }
                    approx.delete();
                }
            }

            // 4. Pattern Decoding and Sorting
            // Sort shapes spatially from Left to Right (X-axis) to maintain reading pattern order at angles
            detectedShapes.sort((a, b) => a.x - b.x);

            // Optional structural optimization: Filter out shapes that sit outside a shared horizontal row
            if (detectedShapes.length > 8) {
                // If extra noise shapes exist, cluster by Y proximity to clean data
                // For simplicity, we prune down to the most confidence-driven elements
                detectedShapes = detectedShapes.slice(0, 8); 
            }

            // Render HUD box overlays onto the working frame canvas
            detectedShapes.forEach(shape => {
                ctx.strokeStyle = shape.type === "0" ? "#00ff00" : "#ff00ff";
                ctx.lineWidth = 3;
                ctx.strokeRect(shape.box.x, shape.box.y, shape.box.width, shape.box.height);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Arial";
                ctx.fillText(shape.type, shape.x - 5, shape.y + 5);
            });

            // Evaluate if we have a perfect 8-digit string sequence match
            if (detectedShapes.length === 8) {
                let codePattern = detectedShapes.map(s => s.type).join("");
                document.getElementById('bitStream').innerText = codePattern;
                document.getElementById('bitStream').style.color = "#00ff00";

                if (ACCOUNTS[codePattern]) {
                    triggerLogin(codePattern, ACCOUNTS[codePattern]);
                } else {
                    document.getElementById('systemMessage').innerText = "Pattern recognized. Access Denied: Unknown ID.";
                }
            } else {
                document.getElementById('bitStream').innerText = detectedShapes.map(s => s.type).join("") + "_".repeat(Math.max(0, 8 - detectedShapes.length));
                document.getElementById('bitStream').style.color = "#ffe600";
                document.getElementById('systemMessage').innerText = `Scanning... Found (${detectedShapes.length}/8) shapes.`;
            }

            // Memory Cleanup inside loop
            contours.delete();
            hierarchy.delete();

            requestAnimationFrame(processVideo);
        }

        let lastLoggedInPattern = "";
        function triggerLogin(pattern, accountData) {
            if (lastLoggedInPattern === pattern) return; // Prevent stuttering updates
            lastLoggedInPattern = pattern;

            const card = document.getElementById('profileCard');
            document.getElementById('cardAvatar').innerText = accountData.avatar;
            document.getElementById('cardName').innerText = accountData.name;
            document.getElementById('cardRole').innerText = accountData.role;
            document.getElementById('cardUID').innerText = `PATTERN ID: ${pattern}`;
            
            card.style.display = "block";
            document.getElementById('systemMessage').innerHTML = `<span style="color:#00ff00; font-weight:bold;">Welcome back, ${accountData.name}!</span>`;
        }
    </script>
</body>
</html>
